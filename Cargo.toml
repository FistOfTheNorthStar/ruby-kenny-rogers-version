[workspace]
resolver = "3"
members = ["crates/kenny-runtime", "crates/kenny-runtime-jit", "crates/kenny-compiler", "crates/kenny"]
exclude = ["vendor"]

[profile.release]
opt-level = 3
debug = false
panic = "abort"
codegen-units = 1
lto = "thin"

[profile.dev]
panic = "abort"

# grass 0.13.4 with source maps (vendor/grass_compiler/KENNY.md)
[patch.crates-io]
grass_compiler = { path = "vendor/grass_compiler" }
