# Linux: frame pointers in the runtime and in the C libraries it builds. A compacting
# collection finds the precise stack slots of compiled frames by walking frame-pointer
# chains (kenny-runtime stackmap.rs); Apple platforms keep frame pointers anyway, and
# compiled Ruby code always does (kenny-compiler `preserve_frame_pointers`).
[target.'cfg(target_os = "linux")']
rustflags = ["-C", "force-frame-pointers=yes"]

[env]
CFLAGS_aarch64_unknown_linux_gnu = "-fno-omit-frame-pointer"
CFLAGS_x86_64_unknown_linux_gnu = "-fno-omit-frame-pointer"
CXXFLAGS_aarch64_unknown_linux_gnu = "-fno-omit-frame-pointer"
CXXFLAGS_x86_64_unknown_linux_gnu = "-fno-omit-frame-pointer"
