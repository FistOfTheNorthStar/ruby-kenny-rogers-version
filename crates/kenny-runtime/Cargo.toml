[package]
name = "kenny-runtime"
version = "0.1.0"
edition = "2024"

[dependencies]
saphyr-parser = "0.2.2"
adler2 = "2.0.1"
crc32fast = "1.5.2"
flate2 = { version = "1.1.10", default-features = false, features = ["rust_backend"] }
aes = "0.9.3"
md-5 = { version = "0.11.0", features = ["oid"] }
sha1 = { version = "0.11.0", features = ["oid"] }
sha2 = { version = "0.11.1", features = ["oid"] }
rsa = { version = "=0.10.0-rc.19", default-features = false, features = ["std", "encoding"] }
corosensei = "0.3.4"
html5ever = "=0.40.1"
httparse = "1.10.1"
indexmap = "2.14.2"
libc = "0.2.191"
mimalloc = { version = "0.1.52", default-features = false }
mio = { version = "1.2.4", features = ["os-poll", "net"] }
num-bigint = "0.5.1"
num-integer = "0.1.47"
num-traits = "0.2.19"
onig = "6.5.3"
quick-xml = "=0.42.0"
rustc-hash = "2.1.3"
libsqlite3-sys = { version = "=0.38.2", features = ["bundled"] }
# asset pipeline (src/assets.rs): Sass and a JavaScript engine for ExecJS
grass_compiler = { version = "=0.13.4", default-features = false, features = ["custom-builtin-fns"] }
rquickjs = "=0.14.0"
unicode-normalization = "0.1.26"
# `prism/prism` (src/prism.rs): the libprism the compiler parses with
ruby-prism-sys = "1.9.0"
rustls = { version = "0.23", default-features = false, features = ["ring", "std", "tls12"] }
ring = "0.17"

[lib]
crate-type = ["staticlib", "rlib"]
